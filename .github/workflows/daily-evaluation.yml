name: Daily Evaluation (ProLevel + YouTube + X)

on:
  schedule:
    # 毎日 JST 10:00 (UTC 01:00) - 月初から9日間実行
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Evaluation month (YYYY-MM, leave empty for previous month)'
        required: false
        type: string
      day:
        description: 'Day number (1-9, leave empty for auto-detect)'
        required: false
        type: string

permissions:
  contents: read

env:
  INPUT_DAY: ${{ inputs.day }}
  INPUT_MONTH: ${{ inputs.month }}
  EVALUATION_JOB_TOKEN: ${{ secrets.EVALUATION_JOB_TOKEN }}
  EVALUATION_BASE_URL: ${{ vars.EVALUATION_BASE_URL || 'https://vtuber-school-evaluation.onrender.com' }}

jobs:
  daily-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2時間タイムアウト
    
    steps:
      - name: Checkout request helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check if within first 9 days of month
        id: check_date
        run: |
          [[ -z "$INPUT_DAY" || "$INPUT_DAY" =~ ^[1-9]$ ]] || exit 1
          [[ -z "$INPUT_MONTH" || "$INPUT_MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || exit 1
          DAY_OF_MONTH=$(date +%d | sed 's/^0//')
          
          if [ -n "$INPUT_DAY" ]; then
            DAY_OF_MONTH="$INPUT_DAY"
            echo "Using manual day: $DAY_OF_MONTH"
          fi
          echo "day=$DAY_OF_MONTH" >> $GITHUB_OUTPUT
          
          if [ $DAY_OF_MONTH -le 9 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Within first 9 days of month, will run evaluation"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Beyond day 9, skipping evaluation"
          fi
      
      - name: Wake up Render service
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          echo "🔥 Waking up Render service..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vtuber-school-evaluation.onrender.com/api/health || echo "000")
            echo "Attempt $i/10: Status $STATUS"
            
            if [ "$STATUS" = "200" ]; then
              echo "✅ Service is ready!"
              break
            fi
            
            if [ $i -lt 10 ]; then
              sleep 10
            fi
          done
          
          sleep 5
      
      - name: Get evaluation month
        if: steps.check_date.outputs.should_run == 'true'
        id: get_month
        run: |
          if [ -n "$INPUT_MONTH" ]; then
            MONTH="$INPUT_MONTH"
          else
            MONTH=$(date -u -d "1 month ago" +%Y-%m)
          fi
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "📅 Evaluating for month: $MONTH"
      
      - name: Calculate batch range for today
        if: steps.check_date.outputs.should_run == 'true'
        id: batch_range
        run: |
          DAY="${{ steps.check_date.outputs.day }}"
          BATCHES_PER_DAY=16  # 1日あたり16バッチ（80人）
          
          # YouTube評価は2日で完了（154人 ÷ 80 = 2日）
          # Day 1: batch 0-15 (80人)
          # Day 2: batch 16-30 (75人) - YouTube完了
          # Day 3-9: プロレベルのみ
          
          START_BATCH=$(( (DAY - 1) * BATCHES_PER_DAY ))
          END_BATCH=$(( START_BATCH + BATCHES_PER_DAY - 1 ))
          
          # YouTubeは31バッチで完了（154人）
          YOUTUBE_TOTAL_BATCHES=31
          
          if [ $END_BATCH -ge $YOUTUBE_TOTAL_BATCHES ]; then
            END_BATCH=$(( YOUTUBE_TOTAL_BATCHES - 1 ))
            echo "youtube_completed=true" >> $GITHUB_OUTPUT
            echo "🎉 YouTube evaluation will be completed today (batch $START_BATCH-$END_BATCH)"
          else
            echo "youtube_completed=false" >> $GITHUB_OUTPUT
          fi
          
          echo "start_batch=$START_BATCH" >> $GITHUB_OUTPUT
          echo "end_batch=$END_BATCH" >> $GITHUB_OUTPUT
          echo "📊 Day $DAY: Processing batches $START_BATCH to $END_BATCH"
      
      # ============================================
      # プロレベル + YouTube 評価（X評価をスキップ）
      # ============================================
      
      - name: Process ProLevel + YouTube evaluation batches
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          MONTH="${{ steps.get_month.outputs.month }}"
          START_BATCH=${{ steps.batch_range.outputs.start_batch }}
          END_BATCH=${{ steps.batch_range.outputs.end_batch }}
          
          echo "🚀 Starting ProLevel + YouTube evaluation for $MONTH"
          echo "Processing batches $START_BATCH to $END_BATCH (16 batches, 83 students)"
          
          for ((i=START_BATCH; i<=END_BATCH; i++)); do
            echo "============================================"
            echo "📦 Processing Batch $i (Day ${{ steps.check_date.outputs.day }})"
            echo "============================================"
            
            MAX_RETRIES=3
            RETRY_COUNT=0
            SUCCESS=false
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = "false" ]; do
              if [ $RETRY_COUNT -gt 0 ]; then
                echo "⏳ Retry $RETRY_COUNT/$MAX_RETRIES after 30 seconds..."
                sleep 30
              fi
              
              # skipX=true でX評価をスキップ（バッチサイズ5）
              RESPONSE=$(node .github/scripts/evaluation-request.mjs "/api/auto-evaluate?month=$MONTH&batchIndex=$i&batchSize=5&skipX=true") || true
              
              HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
              BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
              
              echo "Response Status: $HTTP_STATUS"
              
              if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
                SUCCESS=true
                SUCCESS_COUNT=$(echo "$BODY" | jq -r '.successCount')
                ERROR_COUNT=$(echo "$BODY" | jq -r '.errorCount')
                SKIPPED_COUNT=$(echo "$BODY" | jq -r '.skippedCount')
                echo "✅ Batch $i completed: Success=$SUCCESS_COUNT, Error=$ERROR_COUNT, Skipped=$SKIPPED_COUNT"
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                echo "::warning::Batch $i failed with status $HTTP_STATUS (Attempt $RETRY_COUNT/$MAX_RETRIES)"
              fi
            done
            
            if [ "$SUCCESS" = "false" ]; then
              echo "::error::Batch $i failed after $MAX_RETRIES attempts"
            fi
            
            # 次のバッチの前に少し待機（YouTube APIレート制限対策）
            if [ $i -lt $END_BATCH ]; then
              echo "⏳ Waiting 10 seconds before next batch..."
              sleep 10
            fi
          done
          
          echo "✅ ProLevel + YouTube evaluation completed for Day ${{ steps.check_date.outputs.day }}!"
      
      # ============================================
      # X評価（Day 1のみ実行）
      # ============================================
      
      - name: Check if Day 1 for X evaluation
        if: steps.check_date.outputs.should_run == 'true'
        id: check_day1
        run: |
          DAY="${{ steps.check_date.outputs.day }}"
          if [ "$DAY" = "1" ]; then
            echo "is_day1=true" >> $GITHUB_OUTPUT
            echo "✅ Day 1: Will run X evaluation"
          else
            echo "is_day1=false" >> $GITHUB_OUTPUT
            echo "⏭️ Not Day 1: Skipping X evaluation"
          fi
      
      - name: Reset X evaluation progress
        if: steps.check_day1.outputs.is_day1 == 'true'
        run: |
          MONTH="${{ steps.get_month.outputs.month }}"
          echo "🔄 Resetting X evaluation progress for $MONTH..."
          node .github/scripts/evaluation-request.mjs "/api/auto-evaluate-x-only?reset=true&month=$MONTH" --json-only | jq '.'
      
      - name: Process X Evaluation Batches
        if: steps.check_day1.outputs.is_day1 == 'true'
        run: |
          MONTH="${{ steps.get_month.outputs.month }}"
          echo "🔄 Processing X Evaluation..."
          
          for BATCH_NUM in {0..5}; do
            echo "============================================"
            echo "📦 Processing X Batch $BATCH_NUM"
            echo "============================================"
            
            RESPONSE=$(node .github/scripts/evaluation-request.mjs "/api/auto-evaluate-x-only?month=$MONTH" --json-only)
            echo "$RESPONSE" | jq '.'
            
            IS_COMPLETED=$(echo "$RESPONSE" | jq -r '.progress.isCompleted')
            if [ "$IS_COMPLETED" = "true" ]; then
              echo "🎉 All X evaluations completed!"
              break
            fi
            
            COMPLETED=$(echo "$RESPONSE" | jq -r '.progress.completedStudents')
            TOTAL=$(echo "$RESPONSE" | jq -r '.progress.totalStudents')
            echo "✅ X Batch $BATCH_NUM completed: $COMPLETED/$TOTAL students"
            
            # 次のバッチの前に30分待機
            if [ $BATCH_NUM -lt 5 ]; then
              echo "⏳ Waiting 30 minutes before next X batch..."
              sleep 1800
            fi
          done
      
      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "📊 Daily Evaluation Summary"
          echo "============================================"
          echo "Date: $(date)"
          echo "Day: ${{ steps.check_date.outputs.day }}"
          echo "Month: ${{ steps.get_month.outputs.month }}"
          echo "Batches: ${{ steps.batch_range.outputs.start_batch }} - ${{ steps.batch_range.outputs.end_batch }}"
          echo "Status: Completed"
          echo "============================================"
