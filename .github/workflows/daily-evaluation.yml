name: August 2026 ProLevel backfill
on:
  workflow_dispatch:
    inputs:
      active_index:
        description: Zero-based active roster position for a single August retry
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: school-evaluation-monthly-resume
  cancel-in-progress: false
jobs:
  prolevel:
    if: inputs.active_index == ''
    name: August ProLevel partition ${{ matrix.day }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        day: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      MONTH: '2026-08'
      DAY: ${{ matrix.day }}
      EVALUATION_JOB_TOKEN: ${{ secrets.EVALUATION_JOB_TOKEN }}
      EVALUATION_BASE_URL: ${{ vars.EVALUATION_BASE_URL || 'https://vtuber-school-evaluation.onrender.com' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Process August ProLevel only
        shell: bash
        run: |
          plan=$(node .github/scripts/evaluation-request.mjs "/api/auto-evaluate/plan?month=$MONTH&partitionDay=$DAY&batchSize=5" --json-only)
          batches=$(jq -er '.plan.totalBatches' <<< "$plan")
          selected=$(jq -er '.plan.partitionStudentCount' <<< "$plan")
          invalid=$(jq -er '.plan.invalidActiveCount' <<< "$plan")
          export EVALUATION_ROSTER_REVISION
          EVALUATION_ROSTER_REVISION=$(jq -er '.plan.rosterRevision' <<< "$plan")
          echo "Partition $DAY selected=$selected batches=$batches invalid_active=$invalid"
          failed=0
          saved=0
          missing=0
          errors=0
          for ((i=0; i<batches; i++)); do
            finished=false
            for attempt in 1 2 3; do
              request=$(node .github/scripts/evaluation-request.mjs "/api/auto-evaluate/partition?month=$MONTH&partitionDay=$DAY&batchIndex=$i&batchSize=5&skipX=true&skipYouTube=true&skipWanamiUsage=true") || true
              http=$(sed -n 's/^HTTP_STATUS://p' <<< "$request")
              body=$(sed '/^HTTP_STATUS:/d' <<< "$request")
              if [[ "$http" == 409 ]]; then
                echo '::error::Roster changed during the August backfill'
                exit 1
              fi
              error_count=0
              if [[ "$http" == 200 ]] && jq -e 'has("successCount") and has("errorCount") and has("unevaluatedProLevelCount")' <<< "$body" >/dev/null; then
                saved=$((saved + $(jq -r '.successCount' <<< "$body")))
                missing_count=$(jq -r '.unevaluatedProLevelCount' <<< "$body")
                error_count=$(jq -r '.errorCount' <<< "$body")
                if [[ "$error_count" == 0 || "$attempt" == 3 ]]; then
                  missing=$((missing + missing_count))
                  errors=$((errors + error_count))
                  finished=true
                  break
                fi
              fi
              if [[ "$attempt" != 3 ]]; then sleep 20; fi
            done
            if [[ "$finished" == false ]]; then failed=$((failed + 1)); fi
            echo "Partition $DAY processed batch $((i+1))/$batches saved=$saved missing=$missing errors=$errors failed=$failed"
            if [[ "$((i+1))" != "$batches" ]]; then sleep 16; fi
          done
          echo "August partition $DAY complete: selected=$selected saved=$saved missing=$missing errors=$errors failed=$failed invalid_active=$invalid"
          [[ "$errors" == 0 && "$failed" == 0 && "$invalid" == 0 ]]

  retry:
    if: inputs.active_index != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIVE_INDEX: ${{ inputs.active_index }}
      EVALUATION_JOB_TOKEN: ${{ secrets.EVALUATION_JOB_TOKEN }}
      EVALUATION_BASE_URL: ${{ vars.EVALUATION_BASE_URL || 'https://vtuber-school-evaluation.onrender.com' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retry one August ProLevel evaluation
        shell: bash
        run: |
          [[ "$ACTIVE_INDEX" =~ ^(0|[1-9][0-9]{0,3})$ ]] || exit 1
          result=$(node .github/scripts/evaluation-request.mjs "/api/auto-evaluate?month=2026-08&batchSize=1&batchIndex=$ACTIVE_INDEX&skipEvaluated=true&skipX=true&skipYouTube=true&skipWanamiUsage=true" --json-only)
          printf '%s\n' "$result"
          jq -e '.errorCount == 0 and .successCount + .skippedCount == 1' <<< "$result" >/dev/null
