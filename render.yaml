services:
  - type: web
    name: vtuber-school-evaluation
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: STUDENT_MANAGEMENT_DATABASE_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STUDENT_MASTER_SPREADSHEET_ID
        sync: false
      - key: ABSENCE_SPREADSHEET_ID
        sync: false
      - key: PAYMENT_SPREADSHEET_ID
        sync: false
      - key: RESULT_SPREADSHEET_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EVALUATION_JOB_TOKEN
        sync: false
      - key: APP_ORIGIN
        sync: false
